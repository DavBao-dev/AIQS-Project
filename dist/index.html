<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#141516" />
    <meta
      name="description"
      content="Không gian khám phá seminar, video và những ý tưởng đáng lưu lại."
    />
    <title>AIQS Project — Không gian tri thức</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="fonts.css?v=6" />
    <link rel="stylesheet" href="style.css?v=6" />
    <link rel="stylesheet" href="workspace.css?v=6" />
    <link rel="stylesheet" href="rich-editor.css?v=6" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status"></div>
    <dialog id="publish">
      <form id="publish-form">
        <div class="modal-head">
          <h2>Thêm một ý tưởng hay</h2>
          <button
            type="button"
            class="icon"
            id="close-publish"
            aria-label="Đóng"
          >
            ✕
          </button>
        </div>
        <p>Chia sẻ một nguồn kiến thức vào thư viện cá nhân.</p>
        <label>
          Tiêu đề
          <input
            name="title"
            required
            maxlength="160"
            placeholder="Điều gì khiến bạn muốn lưu lại?"
          />
        </label>
        <label>
          Đường dẫn nguồn
          <input name="url" type="url" required placeholder="https://..." />
        </label>
        <div class="form-row">
          <label>
            Định dạng
            <select name="type">
              <option>Video</option>
              <option>Seminar</option>
              <option>News</option>
            </select>
          </label>
          <label>
            Chủ đề
            <select name="topic">
              <option>Trí tuệ nhân tạo</option>
              <option>Kinh tế & Tài chính</option>
              <option>Triết học & Xã hội</option>
              <option>Toán học</option>
            </select>
          </label>
        </div>
        <label>
          Tóm tắt
          <textarea
            name="desc"
            rows="4"
            required
            placeholder="Những ý chính bạn muốn ghi nhớ..."
          ></textarea>
        </label>
        <button class="primary" type="submit">Thêm vào feed của tôi</button>
        <small>Nội dung được lưu trên trình duyệt này.</small>
      </form>
    </dialog>
    <script src="config.js?v=6"></script>
    <script src="app.js?v=6"></script>
    <script src="account.js?v=6"></script>
    <script src="workspace.js?v=6"></script>
    <script src="annotations.js?v=6"></script>
    <script src="article-core.js?v=6"></script>
    <script src="rich-editor.js?v=6"></script>
  </body>
</html>
